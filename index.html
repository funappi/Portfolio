<!DOCTYPE html>
<html lang="fr" data-fx="max">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Funappi — portfolio</title>
<meta name="description" content="Onze applis conçues et codées par Funappi : FourTimer, Le Gourmet, VOLT Athlete, devinedevine, Code-diff et les autres.">
<meta name="theme-color" content="#07080f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2307080f'/%3E%3Cpath d='M32 10l9 6 6 9v14l-6 9-9 6-9-6-6-9V25l6-9z' fill='none' stroke='%23ff7a1a' stroke-width='4'/%3E%3Ccircle cx='32' cy='32' r='7' fill='%238b7cf6'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
<script>
  // Mode d'effets décidé avant l'affichage : léger sur petits écrans, écrans tactiles ou mouvement réduit.
  (function () {
    var d = document.documentElement, saved = null, lang = null;
    try { saved = localStorage.getItem("fx"); lang = localStorage.getItem("lang"); } catch (e) {}
    var lite = matchMedia("(pointer: coarse)").matches || matchMedia("(max-width: 820px)").matches || matchMedia("(prefers-reduced-motion: reduce)").matches;
    d.dataset.fx = saved || (lite ? "lite" : "max");
    d.lang = lang || ((navigator.language || "fr").toLowerCase().indexOf("fr") === 0 ? "fr" : "en");
  })();
</script>
</head>
<body>
<canvas id="bokeh" aria-hidden="true"></canvas>
<div id="bokeh-lite" aria-hidden="true" hidden><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>

<header class="bar" id="bar">
  <a class="wordmark" href="#" id="homeLink" aria-label="Funappi, accueil">funappi</a>
  <nav class="bar-nav" id="appNav" hidden>
    <a class="back" href="#" id="backLink">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg><span data-t="all"></span>
    </a>
    <button class="icon-btn" id="prevBtn" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg><span class="sr" data-t="prev"></span></button>
    <span class="counter" id="counter" aria-live="polite"></span>
    <button class="icon-btn" id="nextBtn" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg><span class="sr" data-t="next"></span></button>
  </nav>
  <div class="bar-tools">
    <button class="pill-btn" id="fxBtn" type="button" aria-pressed="true"><span data-t="effects"></span> <b id="fxState"></b></button>
    <button class="pill-btn" id="langBtn" type="button"></button>
  </div>
</header>

<main id="home" class="home">
  <section class="hero-home">
    <h1 class="hero-word" id="heroWord" aria-label="funappi"></h1>
    <p class="hero-line" data-t="intro"></p>
  </section>
  <div class="sorts" id="sorts" role="group"></div>
  <section class="grid" id="grid" aria-label="Applis"></section>
  <footer class="foot" id="foot"></footer>
</main>

<section id="universe" class="universe" hidden tabindex="-1"></section>

<div id="veil" class="veil" aria-hidden="true"></div>

<dialog id="lightbox" class="lightbox">
  <button class="lb-close icon-btn" type="button" id="lbClose"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg><span class="sr" data-t="close"></span></button>
  <button class="lb-nav lb-prev icon-btn" type="button" id="lbPrev"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg><span class="sr" data-t="prev"></span></button>
  <div class="lb-stage" id="lbStage"></div>
  <button class="lb-nav lb-next icon-btn" type="button" id="lbNext"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg><span class="sr" data-t="next"></span></button>
</dialog>

<div id="intro" class="intro" hidden>
  <div class="intro-word" id="introWord" aria-hidden="true"></div>
  <button class="intro-skip" type="button" id="introSkip" data-t="skip"></button>
</div>

<div id="cursor" class="cursor" aria-hidden="true"><span class="cursor-dot"></span><span class="cursor-ring"><em id="cursorLabel"></em></span></div>

<script src="js/data.js"></script>
<script src="js/media.js"></script>
<script src="js/bokeh.js"></script>
<script src="js/app.js"></script>
</body>
</html>
